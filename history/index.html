<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L-Charge Backoffice · UN-401 · Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --text:#0a0a0a; --text-2:#525252; --text-3:#757575;
    --border:#e6e6e6; --g-50:#f5f5f5; --g-200:#e6e6e6; --g-300:#d6d6d6; --g-400:#a3a3a3;
    --green:#1dcc6e; --green-surface:#edfcf4; --green-line:#a5ecc8; --green-ink:#0d7a44;
    --danger:#f55451; --danger-surface:#fef1f1; --danger-line:#fbc4c3; --danger-ink:#8a2f2d;
    --amber:#f7a916; --amber-surface:#fef8ec; --red:#c53027;
    --r:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);background:#fff;
       font-size:14px;line-height:20px;letter-spacing:-.006em;font-synthesis:none;
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  button,select,input,textarea{font-family:inherit;font-size:14px;line-height:20px;letter-spacing:-.006em;color:var(--text)}
  button{cursor:pointer;border:none;background:none}
  svg{display:block;flex:none}

  /* ============ TOP BAR ============ */
  .topbar{display:flex;align-items:center;gap:30px;padding:14px 24px;border-bottom:1px solid var(--border)}
  .logo{display:flex;align-items:center;gap:9px}
  .logo .wm{font-weight:700;letter-spacing:-.03em;font-size:17px}
  .logo .bo{font-size:9px;font-weight:600;background:var(--text);color:#fff;padding:2px 5px;border-radius:2px;letter-spacing:.08em}
  .nav{display:flex;gap:2px;flex:1}
  .nav button{padding:7px 13px;border-radius:7px;color:var(--text-2);display:flex;align-items:center;gap:5px}
  .nav button:hover{background:#fafafa}
  .nav button.on{background:var(--g-50);color:var(--text);font-weight:500}
  .me{display:flex;align-items:center;gap:9px;color:var(--text)}
  .me .av{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;
          display:grid;place-items:center;font-size:11px;font-weight:600}

  /* ============ SUB HEADER ============ */
  .page{padding:18px 24px 80px}
  .pager{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px}
  .sq{width:32px;height:32px;border:1px solid var(--border);border-radius:var(--r);display:grid;place-items:center;color:var(--text-2)}
  .sq:hover{background:var(--g-50)}
  .pager span{margin-left:6px}

  .uhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin:22px 0 4px}
  .uleft{display:flex;gap:14px;align-items:flex-start}
  .uicon{width:40px;height:40px;border-radius:50%;background:var(--g-50);display:grid;place-items:center;color:var(--text-2);flex:none}
  .utitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .utitle h1{font-size:22px;font-weight:600;letter-spacing:-.025em}
  .tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;
       padding:3px 9px;font-size:13px;color:var(--text-3)}
  .umeta{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13.5px;margin-top:7px}
  .umeta .sep{color:var(--g-300)}
  .uacts{display:flex;gap:8px;flex:none}
  .obtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--r);
        padding:8px 13px;font-weight:500;background:#fff;white-space:nowrap}
  .obtn:hover{background:var(--g-50)}
  .obtn svg{color:var(--text-2)}

  /* ============ TABS ============ */
  .tabs{display:flex;gap:28px;border-bottom:1px solid var(--border);margin:22px 0 26px}
  .tabs button{padding:0 0 12px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:15px}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{color:var(--text);font-weight:500;border-color:var(--text)}

  /* ============ LAYOUT ============ */
  .cols{display:grid;grid-template-columns:170px minmax(0,1fr);gap:36px;align-items:start}
  .subnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:18px}
  .subnav button{text-align:left;padding:9px 13px;border-radius:var(--r);color:var(--text-2)}
  .subnav button:hover{background:#fafafa;color:var(--text)}
  .subnav button.on{background:var(--g-50);color:var(--text);font-weight:500}
  /* группа History: заголовок с шевроном + вложенные пункты */
  .navgroup{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;
    text-align:left;padding:9px 13px;border-radius:var(--r);color:var(--text-2)}
  .navgroup:hover{background:#fafafa;color:var(--text)}
  .navgroup.active{background:var(--g-50);color:var(--text);font-weight:500}
  .navgroup .chev{transition:transform .15s;color:var(--text-3)}
  .navgroup.open .chev{transform:rotate(180deg)}
  .navkids{display:flex;flex-direction:column;gap:2px;margin:2px 0 2px 12px;padding-left:11px;
    border-left:1px solid var(--border);overflow:hidden}
  .navkids button{padding:8px 12px;font-size:13.5px}
  .navkids button .ro{font-size:11px;color:var(--g-400);margin-left:6px;font-weight:400}
  .navkids button.on .ro{color:var(--text-3)}

  h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
  .lead{color:var(--text-2);margin-top:5px;font-size:14px}
  .hr{height:1px;background:var(--border);margin:22px 0}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:32px;padding:6px 12px;border-radius:var(--r);font-weight:500;white-space:nowrap}
  .btn-p{background:var(--text);color:#fff;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .btn-p:hover:not(:disabled){background:#262626}
  .btn-p:disabled{background:var(--g-300);cursor:not-allowed}
  .btn-g{border:1px solid var(--border);background:#fff}
  .btn-g:hover:not(:disabled){background:var(--g-50)}
  .btn-d{background:var(--red);color:#fff}

  /* ============ FORM ROWS ============ */
  .frow{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:40px;padding:4px 0}
  .fl h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .fl p{color:var(--text-2);margin-top:7px;font-size:13.5px;line-height:1.5}
  .bo-only{font-size:12px;font-weight:400;color:var(--text-3);border:1px solid var(--border);border-radius:6px;padding:2px 7px}
  .fr{display:flex;flex-direction:column;gap:16px;max-width:560px}
  label{display:block;margin-bottom:8px;color:var(--text-2);font-size:14px;font-weight:500;line-height:20px}
  .ctrl{width:100%;min-height:32px;border:1px solid var(--border);border-radius:var(--r);padding:6px 12px;background:#fff;line-height:20px}
  .ctrl::placeholder{color:var(--g-400)}
  .ctrl:focus{outline:2px solid var(--text);outline-offset:-1px}
  select.ctrl{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23757575' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;padding-right:34px}
  .dtrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px}
  .withic{position:relative}
  .withic svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;z-index:1}
  .withic .ctrl{padding-left:36px}
  /* нативная иконка date/time дублировала бы нашу слева: делаем её прозрачной
     и растягиваем на всё поле — клик по полю по-прежнему открывает пикер */
  .withic .ctrl::-webkit-calendar-picker-indicator{
    position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer}
  .ctrl:disabled{background:var(--g-50);color:var(--text-3);cursor:not-allowed}
  .withic .ctrl:disabled ~ svg,
  .withic:has(.ctrl:disabled) svg{color:var(--g-400)}
  .align-r{display:flex;justify-content:flex-end}
  .mapbox{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;height:290px;position:relative;background:#eae5dc}
  .mapzoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;background:#fff;border-radius:5px;
    box-shadow:0 1px 4px rgba(0,0,0,.3);overflow:hidden}
  .mapzoom button{width:28px;height:28px;display:grid;place-items:center;color:#666}
  .mapzoom button+button{border-top:1px solid #e6e6e6}
  .swrow{display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
  .switch{width:42px;height:24px;border-radius:12px;background:var(--g-300);position:relative;flex:none;transition:background .15s}
  .switch.on{background:var(--green)}
  .switch:disabled{opacity:.45;cursor:not-allowed}
  .switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;
    box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .switch.on i{left:20px}

  /* ============ TABLE ============ */
  .thead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:14px}
  .thead h3{font-size:15px;font-weight:600}
  .thead .h{color:var(--text-2);font-size:13.5px;margin-top:3px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-weight:500;color:var(--text-3);font-size:14px;padding:14px 14px 13px 0;border-bottom:1px solid var(--border)}
  th .sort{display:inline-flex;align-items:center;gap:5px;color:var(--text-2)}
  th .sort:hover{color:var(--text)}
  td{padding:14px 14px 14px 0;border-bottom:1px solid var(--border);vertical-align:middle;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#fafafa}
  .stat{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.ok{background:var(--green)} .dot.no{background:var(--g-400)}
  .nowtag{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:500;margin-left:10px;white-space:nowrap}
  .muted{color:var(--text-3)}
  /* строки-разрывы: период, когда партнёр/сайт не были назначены */
  tr.gaprow td{color:var(--g-400);background:#fcfcfc}
  tr.gaprow:hover td{background:var(--g-50)}
  .kb{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--text-3);margin-left:auto}
  .kb:hover,.kb.open{background:var(--g-50);color:var(--text-2)}
  td.act{width:52px;padding-right:0}
  .menu{position:absolute;background:#fff;border:1px solid var(--border);border-radius:10px;
        box-shadow:0 8px 28px rgba(0,0,0,.12);padding:5px;min-width:172px;z-index:60}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:6px;color:var(--text)}
  .menu button:hover{background:var(--g-50)}
  .menu button.q{color:var(--text)}
  .menu button.q:hover{color:var(--red);background:var(--danger-surface)}
  @keyframes fl{0%,50%{background:#fffbeb}100%{background:transparent}}
  tr.fresh td{animation:fl 1.8s ease}

  /* ============ CURRENT STATE CARD ============ */
  .cs{border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:30px}
  .cs .top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  .cs .eb{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);font-weight:600}
  .cs .lb{font-size:20px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;margin-top:8px}
  .cs .lb .dot{width:9px;height:9px}
  .cs .mt{color:var(--text-2);margin-top:8px;font-size:13.5px}
  .cs .cm{color:var(--text-2);margin-top:5px;font-size:13.5px}
  .cs .acts{display:flex;gap:8px;flex:none}
  .gate{margin-top:15px;border-radius:var(--r);padding:11px 13px;font-size:13.5px;line-height:1.5;
        background:var(--amber-surface);color:#7a5200}
  .gate ul{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:3px}
  .gate li::before{content:"○ "}
  .gate u{cursor:pointer}

  .foot{background:var(--g-50);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--text-2);
        line-height:1.55;margin-top:18px}
  .foot b{color:var(--text);font-weight:600}

  /* ============ MODAL ============ */
  .bd{position:fixed;inset:0;background:rgba(10,10,10,.4);display:none;place-items:center;z-index:90;padding:24px}
  .bd.on{display:grid}
  .md{background:#fff;border-radius:12px;width:min(480px,100%);box-shadow:0 0 2px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.16);max-height:92vh;overflow:auto}
  .md header{padding:22px 24px 10px} .md h3{font-size:18px;font-weight:500;line-height:28px;letter-spacing:-.014em}
  .md .b{padding:12px 24px;display:flex;flex-direction:column;gap:16px}
  .md footer{padding:12px 24px 24px;display:flex;justify-content:flex-end;gap:8px}
  .md.record-md{width:min(480px,100%)}
  .record-md header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:22px}
  .record-md h3{font-size:18px;letter-spacing:-.014em;line-height:28px}
  .modal-close{width:32px;height:32px;margin:-6px -6px 0 0;border-radius:6px;color:var(--text-2);display:grid;place-items:center;flex:none}
  .modal-close:hover{background:var(--g-50);color:var(--text)}
  .modal-close svg{width:20px;height:20px}
  .record-intro{font-size:14px;line-height:20px;text-wrap:pretty}
  .record-md .b{gap:16px}
  .record-fields{display:flex;flex-direction:column;gap:24px;padding:16px;border-radius:6px;background:var(--g-50)}
  .record-md #rzn,.record-md #dates{display:flex;flex-direction:column;gap:24px}
  .record-md #rzn:empty{display:none}
  .record-status-row{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .record-status-label{font-size:14px;font-weight:500}
  .record-status-row .seg,.record-status-row .status-dropdown{width:229px}
  .record-status-row .switch{margin-block:4px}
  .status-dropdown-trigger:disabled{background:var(--g-50);color:var(--text-3);cursor:not-allowed}
  .edit-status .seg button:disabled{cursor:default}
  .edit-status .seg button.on:disabled{opacity:1}
  .tofield{position:relative}
  .tofield .ctrl{padding-right:46px}
  .to-shortcut{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:6px;color:var(--text-2);display:grid;place-items:center;z-index:2}
  .to-shortcut:hover{background:#fff;color:var(--text)}
  .to-shortcut:disabled{opacity:.35;cursor:not-allowed}
  .to-shortcut svg{width:20px;height:20px}
  .record-check{display:inline-flex;align-items:center;gap:9px;color:var(--text);font-size:14px;cursor:pointer}
  .record-check input{width:18px;height:18px;accent-color:var(--text);cursor:pointer}
  .record-check input:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .field-error .ctrl{border-color:var(--danger)}
  .field-error .ctrl:focus{outline-color:var(--danger)}
  .field-msg{display:flex;align-items:flex-start;gap:7px;margin-top:7px;color:var(--danger);font-size:12.5px;line-height:1.4}
  .field-msg svg{width:16px;height:16px;flex:none;margin-top:1px}
  .affect-alert{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid #eadfcb;border-radius:10px;background:#fffaf1;color:var(--text);line-height:1.45}
  .affect-alert svg{width:22px;height:22px;margin-top:1px;flex:none}
  .affect-alert strong{display:block;font-size:14px;font-weight:600}
  .affect-alert span{display:block;margin-top:3px;color:var(--text-2);font-size:13px}
  .record-md footer{padding-top:12px}
  .hint{font-size:12.5px;color:var(--text-3);margin-top:6px;line-height:1.45}
  .was{background:var(--g-50);border-radius:var(--r);padding:11px 13px;font-size:13px;color:var(--text-2);line-height:1.5}
  .was b{color:var(--text)}
  .err{background:var(--danger-surface);color:var(--red);border-radius:var(--r);padding:11px 13px;font-size:13px;line-height:1.5}
  .warn{background:var(--amber-surface);color:#7a5200;border-radius:var(--r);padding:11px 13px;font-size:13px;line-height:1.5}
  .warn u{cursor:pointer}
  .pv{border:1px solid var(--border);border-radius:10px;padding:14px;background:#fcfcfc}
  .pv .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:10px}
  .bar{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px}
  .bar .sg{display:grid;place-items:center;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;padding:0 5px}
  .sg.o{background:var(--danger-line);color:#8a2f2d} .sg.n{background:var(--danger);color:#fff}
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:6px}
  .pvt{font-size:12.5px;color:var(--text-2);line-height:1.55;margin-top:11px}
  .pvt b{color:var(--text);font-weight:600}
  .pvt.w{background:var(--amber-surface);color:#7a5200;border-radius:7px;padding:10px 12px}

  /* --- перенос из variant B: бейдж Current, сегмент-контрол, превью-бары --- */
  /* статус + бейдж Current в один ряд, без переноса */
  .statuscell{display:flex;align-items:center;gap:10px;white-space:nowrap}
  .curtag{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:500;white-space:nowrap}
  .seg{display:flex;background:var(--g-50);border-radius:6px;padding:0;gap:0}
  .seg button{flex:1;min-height:32px;padding:6px 12px;border-radius:6px;color:var(--text-2);font-size:14px;line-height:20px;display:flex;align-items:center;justify-content:center;gap:8px}
  .seg button.on{background:#fff;border:1px solid var(--g-200);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .status-dropdown{position:relative;width:280px;flex:none}
  .status-dropdown-trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:32px;
    padding:6px 12px;border:1px solid var(--border);border-radius:var(--r);background:#fff;color:var(--text);font-weight:500;text-align:left}
  .status-dropdown-trigger:hover{background:#fafafa}
  .status-dropdown-trigger:focus-visible,.status-dropdown-option:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .status-dropdown-value{display:inline-flex;align-items:center;gap:8px;min-width:0}
  .status-dropdown-chevron{width:16px;height:16px;color:var(--text-2);transition:transform .15s}
  .status-dropdown.open .status-dropdown-chevron{transform:rotate(180deg)}
  .status-dropdown-menu{position:absolute;top:calc(100% + 4px);right:0;z-index:25;width:100%;padding:8px;
    border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.12)}
  .status-dropdown-option{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:8px 10px;border-radius:6px;color:var(--text);text-align:left}
  .status-dropdown-option:hover,.status-dropdown-option[aria-selected="true"]{background:var(--g-50)}
  .status-dropdown-option:disabled{color:var(--g-400);cursor:not-allowed}
  .status-dropdown-option:disabled:hover{background:transparent}
  .status-dropdown-divider{height:1px;margin:4px 10px;background:var(--border)}

  /* ============ AVAILABILITY HISTORY VARIANTS ============ */
  .availability-table-wrap{overflow-x:auto}
  .availability-timeline{min-width:760px;--timeline-content-start:42px}
  .availability-timeline-head,.availability-timeline-row{display:grid;grid-template-columns:28px minmax(220px,1.1fr) minmax(170px,1fr) minmax(140px,.8fr) minmax(120px,.7fr) 52px;gap:14px}
  .availability-timeline-head,.availability-timeline-row{position:relative}
  .availability-timeline-head{padding:14px 0 13px;color:var(--text-3);font-size:14px;font-weight:500}
  .availability-timeline-head::after,.availability-timeline-row::after{content:"";position:absolute;right:0;bottom:0;left:var(--timeline-content-start);height:1px;background:var(--border)}
  .availability-timeline-row{min-height:82px;padding:14px 0;align-items:start}
  .availability-timeline-row:hover{background:#fafafa}
  .timeline-marker{position:relative;display:flex;justify-content:center;height:100%}
  .timeline-marker::after{content:"";position:absolute;top:12px;bottom:-28px;width:1px;background:var(--border)}
  .availability-timeline-row:last-child .timeline-marker::after{display:none}

/* ---- Часы прототипа ---------------------------------------------------

const ANCHOR   = '2026-07-16T14:20';

const pad2 = n => String(n).padStart(2,'0');
const isoMin = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

const shift = ts => ts == null ? ts : isoMin(new Date(new Date(ts).getTime() + SHIFT));

   время суток (11:00, 9:15), а не съезжает на случайные минуты.
   Если при этом якорь оказался бы в будущем (смотрим прототип рано утром) —
   отступаем ещё на сутки, чтобы вся история осталась в прошлом. */
function computeShift(){
  if(!liveClock) return 0;
  const a = new Date(ANCHOR), n = new Date(realNow());
  const day = 86400000;

  const d1 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  let s = Math.round((d1 - d0) / day) * day;
  if(new Date(a.getTime() + s) > n) s -= day;
  return s;
}

function tick(){ NOW = liveClock ? realNow() : ANCHOR; }
const ME = 'Nick Smith';

const fmt = ts => { if(!ts) return 'Now'; const d = new Date(ts);

  const m = Math.floor((new Date(b||NOW) - new Date(a))/60000);
  const d = Math.floor(m/1440), h = Math.floor((m%1440)/60), mm = m%60;
  if(d) return `${d}d ${h}h`; if(h) return `${h}h ${mm}m`; return `${mm}m`;
}
const mn = (a,b) => Math.max(1, Math.floor((new Date(b||NOW) - new Date(a))/60000));
const ovl = (a1,a2,b1,b2) => a1 < b2 && b1 < a2;
const dpart = ts => ts.slice(0,10), tpart = ts => ts.slice(11,16);
const join = (d,t) => (d&&t) ? `${d}T${t}` : '';

const sorted = () => [...recs].sort((a,b)=>a.from<b.from?-1:1);
/* Availability is an event timeline: a record ends exactly when the next one starts. */
function rebuildTimeline(list){
  const events = [...list].sort((a,b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0);
  return events.map((r, index) => ({...r, to:events[index + 1]?.from || null}));
}
const cur = () => recs.find(r => r.to === null);
const label = r => r.st === 'ok' ? 'Available' : (r.reason ? `Unavailable · ${r.reason}` : 'Unavailable');
const availabilityOptionIndex = state => Math.max(0, AVAILABILITY_OPTIONS.findIndex(option =>
  option.st === state.st && option.reason === (state.reason || '')));
const availabilityOptionDisabled = (option, currentStatus) => option.st !== currentStatus && (
  (option.st === 'no' && sc.session) || (option.st === 'ok' && !sc.fields)
);
/* Записи различают статус и причина. Комментарий — не различитель:
   два одинаковых статуса подряд недопустимы, даже с разными комментариями. */
const same = (a,b) => a.st === b.st && (a.reason||'') === (b.reason||'');
function timelineNeighbors(from, excludeId = null){
  const events = sorted().filter(r => r.id !== excludeId);
  return {
    previous:[...events].reverse().find(r => r.from < from),
    next:events.find(r => r.from > from),
  };
}
function duplicateStateError(candidate, previous, next){
  const adjacent = [previous, next].find(record => record && same(candidate, record));
  if(!adjacent) return {};
  return candidate.st === 'no'
    ? {reason:'Choose a reason different from the adjacent unavailable record.'}
    : {status:'Choose a status different from the adjacent availability record.'};
}


function bar(list, w0, w1){
  return `<div class="bar">${list.filter(r => (r.to||NOW) > w0 && r.from < w1).map(r => {
    const a = r.from < w0 ? w0 : r.from, b = (r.to||NOW) > w1 ? w1 : (r.to||NOW);
    return `<div class="sg ${r.st}${r.isNew?' nw':''}" style="flex:${mn(a,b)}">${r.st==='ok'?'Available':(esc(r.reason)||'Unavailable')}</div>`;
  }).join('')}</div>`;
}

/* Заголовок периода: либо «X from-to», либо пара «Starts from» / «Ends» */
const dcHead = (single, w) => `<th style="width:${w}px"><button class="sort">${single} ${IC.sort}</button></th>`;
/* Ячейки периода. to === null — период продолжается, показываем «Now» */
const dcCell = (from, to) => `<td>${fmt(from)} – ${fmt(to)}</td>`;

/* Партнёры и сайты, в отличие от availability, НЕ непрерывны: между назначениями
   бывают промежутки, когда партнёр/сайт не заданы. Достраиваем их явными строками. */
function withGaps(list){
  const asc = [...list].sort((a,b) => a.from < b.from ? -1 : 1);
  const out = [];
  asc.forEach((r, i) => {
    const prev = asc[i-1];
    if(prev && prev.to && prev.to < r.from) out.push({from:prev.to, to:r.from, gap:true});
    out.push(r);
  });
  return out.reverse();   /* в таблице — от новых к старым */
}

function kebab(e, id){
  document.querySelectorAll('.menu').forEach(m => m.remove());
  const btn = e.currentTarget, r = btn.getBoundingClientRect();
  btn.classList.add('open');
  const m = document.createElement('div'); m.className = 'menu';
  m.style.top = (r.bottom + scrollY + 6) + 'px'; m.style.left = (r.right + scrollX - 172) + 'px';
  m.innerHTML = `<button data-a="e">${IC.pen} Edit</button><button class="q" data-a="d">${IC.bin} Delete record</button>`;
  document.body.appendChild(m);
  m.querySelector('[data-a=e]').onclick = () => { m.remove(); dlgEdit(id); };
  const del = m.querySelector('[data-a=d]'); if(del) del.onclick = () => { m.remove(); dlgDel(id); };
  setTimeout(() => document.addEventListener('click', function h(){
    m.remove(); btn.classList.remove('open'); document.removeEventListener('click', h); }), 0);
}

function render(){
  tick();
  renderNav();
  document.getElementById('main').innerHTML = ({
    general: pageGeneral, operational: pageOperational,
    partners: pagePartners, sites: pageSites, availability: pageAvailability,
    soc: pageSoc, ocpp: pageOcpp,
  })[page]();
  if(page === 'availability') bindAvailability();
  if(page === 'general'){
    const sw = document.getElementById('gSw');
    if(sw) sw.onclick = gStartToggle;
    document.querySelectorAll('#gSeg button').forEach(b => {
      if(!b.disabled) b.onclick = () => gApply({st: b.dataset.v});
    });
    const statusTrigger = document.getElementById('gStatusTrigger');
    if(statusTrigger){
      const state = gDraft || {st:cur().st, reason:cur().reason||''};
      const focusStatusOption = index => requestAnimationFrame(() => document.getElementById(`gStatusOption${index}`)?.focus());
      const nextStatusOption = (index, step) => {
        for(let offset = 1; offset <= AVAILABILITY_OPTIONS.length; offset++){
          const candidate = (index + step * offset + AVAILABILITY_OPTIONS.length) % AVAILABILITY_OPTIONS.length;
          if(!availabilityOptionDisabled(AVAILABILITY_OPTIONS[candidate], state.st)) return candidate;
        }
        return index;
      };
      const openStatusDropdown = index => { gStatusOpen = true; gStatusFocus = index; render(); focusStatusOption(index); };
      const closeStatusDropdown = () => { gStatusOpen = false; render(); requestAnimationFrame(() => document.getElementById('gStatusTrigger')?.focus()); };
      const chooseStatusOption = index => {
        const option = AVAILABILITY_OPTIONS[index];
        if(availabilityOptionDisabled(option, state.st)) return;
        gStatusOpen = false;
        gStatusFocus = index;
        gApply({st:option.st, reason:option.reason});
      };
      statusTrigger.onclick = () => {
        if(gStatusOpen) closeStatusDropdown();
        else openStatusDropdown(availabilityOptionIndex(state));
      };
      statusTrigger.onkeydown = event => {
        if(event.key === 'ArrowDown' || event.key === 'ArrowUp'){
          event.preventDefault();
          openStatusDropdown(nextStatusOption(availabilityOptionIndex(state), event.key === 'ArrowDown' ? 1 : -1));
        }
        if(event.key === 'Escape' && gStatusOpen){ event.preventDefault(); closeStatusDropdown(); }
      };
      document.querySelectorAll('.status-dropdown-option').forEach(button => {
        const index = Number(button.dataset.ddIndex);
        button.onclick = () => chooseStatusOption(index);
        button.onkeydown = event => {
          let target = null;
          if(event.key === 'ArrowDown') target = nextStatusOption(index, 1);
          if(event.key === 'ArrowUp') target = nextStatusOption(index, -1);
          if(event.key === 'Home') target = nextStatusOption(-1, 1);
          if(event.key === 'End') target = nextStatusOption(0, -1);
          if(target !== null){ event.preventDefault(); gStatusFocus = target; render(); focusStatusOption(target); return; }
          if(event.key === 'Escape'){ event.preventDefault(); closeStatusDropdown(); return; }
          if(event.key === 'Enter' || event.key === ' '){ event.preventDefault(); chooseStatusOption(index); }
          if(event.key === 'Tab'){ gStatusOpen = false; requestAnimationFrame(render); }
        };
      });
    }
    const gl = document.getElementById('gLink'); if(gl) gl.onclick = () => { page = 'availability'; render(); };
    const rz = document.getElementById('gReason'); if(rz) rz.onchange = e => gApply({reason: e.target.value});
    const cm = document.getElementById('gComment');
    if(cm) cm.oninput = e => { const p = e.target.selectionStart; gApply({comment: e.target.value});
      const t = document.getElementById('gComment'); if(t){ t.focus(); try{ t.setSelectionRange(p, p); }catch(_){} } };
    const ac = document.getElementById('gAddComment');
    if(ac) ac.onclick = () => { gCommentOpen = true; render(); requestAnimationFrame(() => document.getElementById('gComment')?.focus()); };
    const fd = document.getElementById('gFromD'), ft = document.getElementById('gFromT');
    const syncGeneralTimeLimit = () => { if(fd && ft) ft.max = fd.value === dpart(NOW) ? tpart(NOW) : ''; };
    const readFrom = () => { if(gDraft) gDraft.from = join(fd.value, ft.value); syncGeneralTimeLimit(); };
    if(fd){ fd.onchange = readFrom; fd.oninput = readFrom; }
    if(ft){ ft.onchange = readFrom; ft.oninput = readFrom; }
    syncGeneralTimeLimit();
    const sv = document.getElementById('gSave'); if(sv) sv.onclick = gSaveDraft;
    const rb = document.getElementById('gResetBtn'); if(rb) rb.onclick = gResetDraft;
  } else { gClear(); }
  document.querySelectorAll('.kbd').forEach(b => b.onclick = e => {
    document.querySelectorAll('.menu').forEach(m => m.remove());
    const r = e.currentTarget.getBoundingClientRect();
    const m = document.createElement('div'); m.className = 'menu';
    m.style.top = (r.bottom + scrollY + 6) + 'px'; m.style.left = (r.right + scrollX - 172) + 'px';
    m.innerHTML = `<button>${IC.pen} Edit</button><button class="q">${IC.bin} Delete record</button>`;
    document.body.appendChild(m);
    setTimeout(() => document.addEventListener('click', function h(){ m.remove(); document.removeEventListener('click', h); }), 0);
  });
  fresh = null;
}

const bd = document.getElementById('bd'), md = document.getElementById('md');

  modalStatusDropdown = null;
  bd.classList.remove('on');
  modalSiblings().forEach(el => { el.inert = false; });
  md.innerHTML = '';
  md.classList.remove('record-md');
  modalOpener?.focus();
  modalOpener = null;
};
bd.onclick = e => { if(e.target === bd) close(); };
addEventListener('keydown', e => {
  if(!bd.classList.contains('on')) return;
  if(e.defaultPrevented) return;
  if(e.key === 'Escape'){ e.preventDefault(); close(); }
  if(e.key !== 'Tab') return;
  const focusable = [...md.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled)')];
  if(!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
const open = h => {
  modalOpener = document.activeElement;
  md.classList.remove('record-md');
  md.innerHTML = h;
  md.setAttribute('role','dialog');
  md.setAttribute('aria-modal','true');
  md.setAttribute('aria-labelledby','dialogTitle');
  modalSiblings().forEach(el => { el.inert = true; });
  bd.classList.add('on');
  requestAnimationFrame(() => (md.querySelector('[data-autofocus], button, input, select, textarea'))?.focus());
};

/* ===== General: inline-редактирование статуса + остров сохранения ===== */
let gDraft = null, gTouched = false, gCommentOpen = false, gStatusOpen = false, gStatusFocus = 0, gMemo = {cm:{}, rs:{}};
/* ключ состояния: комментарий привязан к паре «статус + причина» */
const stateKey = r => r.st === 'no' ? `no|${r.reason||''}` : 'ok';
function gClear(){ gDraft = null; gTouched = false; gCommentOpen = false; gStatusOpen = false; gStatusFocus = 0; gMemo = {cm:{}, rs:{}}; }
/* Записать можно только смену статуса или причины: два одинаковых статуса
   подряд не допускаются, разный комментарий их не различает. */
function gChanged(c, d){
  return d.st !== c.st || (d.st === 'no' && (d.reason||'') !== (c.reason||''));
}
/* Любое изменение полей формирует черновик. Записываемым его делает только
   смена статуса или причины (см. gChanged). */
function gApply(patch){
  const c = cur();
  const base = gDraft || {st:c.st, reason:c.reason||'', comment:c.comment||'', from:NOW};
  const next = {...base, ...patch};
  const stChanged = 'st' in patch && patch.st !== base.st;
  const rsChanged = 'reason' in patch && patch.reason !== base.reason;
  if(stChanged || rsChanged){
    gCommentOpen = false;
    /* Комментарий принадлежит паре «статус + причина», причина — статусу.
       Уходя из состояния, запоминаем оба; возвращаясь — достаём обратно,
       поэтому исходный комментарий не теряется при переключении «туда-обратно». */
    gMemo.cm[stateKey(base)] = base.comment;
    gMemo.rs[base.st] = base.reason;
    if(stChanged && !('reason' in patch)) next.reason = next.st === 'no' ? (gMemo.rs.no ?? '') : '';
    if(next.st === 'ok') next.reason = '';
    next.comment = gMemo.cm[stateKey(next)] ?? '';
  }
  if(next.st === 'ok') next.reason = '';        // у available нет причины
  next.comment = next.comment || '';
  gTouched = true;
  gDraft = next;
  render();
}
function gStartToggle(){
  const st = gDraft ? gDraft.st : cur().st;
  gApply({ st: st === 'ok' ? 'no' : 'ok' });
}
function gResetDraft(){ gClear(); render(); }
/* Общая запись изменения статуса: валидация + вставка. Используют и inline/card,
   и модальный вариант. Возвращает текст ошибки либо null при успехе. */
function commitStatus(d){
  tick();
  const c = cur();
  const statusChanged = d.st !== c.st;
  if(d.from > NOW) return 'The date can’t be in the future.';
  if(d.from < c.from) return `Roll back no further than ${fmt(c.from)} — that’s when the current state started.`;
  if(statusChanged && d.st === 'no' && sc.session) return 'Charger 01 has an active session. Stop it in Live charging first.';
  if(statusChanged && d.st === 'ok' && !sc.fields) return 'Fill in Partner, Location and Individual clients rate first.';
  const cm = (d.comment || '').trim();
  const rs = d.st === 'no' ? d.reason : '';
  const c2 = cur();
  if(d.from > c2.from){ recs.push({id:++seq, from:d.from, st:d.st, reason:rs, comment:cm, by:ME}); }
  else { c2.st = d.st; c2.reason = rs; c2.comment = cm; c2.by = ME; }
  recs = rebuildTimeline(recs).map(r => ({...r, isNew:undefined}));
  return null;
}
function gSaveDraft(){
  const c = cur(), d = gDraft; if(!d) return;
  if(!gChanged(c, d)){ gClear(); render(); return; }
  const err = commitStatus(d);
  if(err){ const box = document.getElementById('gErr'); if(box) box.innerHTML = `<div class="err">${err}</div>`; return; }
  gClear();
  render();
}

    document.querySelectorAll('.status-dropdown-option').forEach(button => {
      const index = Number(button.dataset.ddIndex);
      button.onclick = () => choose(index);
      button.onkeydown = event => {
        let target = null;
        if(event.key === 'ArrowDown') target = nextStatusOption(index, 1);
        if(event.key === 'ArrowUp') target = nextStatusOption(index, -1);
        if(event.key === 'Home') target = nextStatusOption(-1, 1);
        if(event.key === 'End') target = nextStatusOption(0, -1);
        if(target !== null){ event.preventDefault(); statusFocus = target; paintForm(); focusOption(target); return; }
        if(event.key === 'Escape'){ event.preventDefault(); closeDropdown(); return; }
        if(event.key === 'Enter' || event.key === ' '){ event.preventDefault(); choose(index); }
        if(event.key === 'Tab'){ statusOpen = false; requestAnimationFrame(paintForm); }
      };
    });
    modalStatusDropdown = statusOpen ? {id:'fStatusDropdown', isOpen:() => statusOpen, close:closeDropdown} : null;
  }
  function paintForm(){
    $('fStatusControl').innerHTML = statusControlMarkup();
    $('rzn').innerHTML = s.st === 'no' && availCtl !== 'dropdown'
      ? `<div id="fReasonField"><label for="fR">Reason unavailable <span class="opt">(optional)</span></label><select class="ctrl" id="fR" aria-describedby="fReasonErr">
          <option value="">Select reason</option>${REASONS.map(r=>`<option ${s.reason===r?'selected':''}>${r}</option>`).join('')}</select><div id="fReasonErr"></div></div>` : '';
    if($('fR')) $('fR').onchange = e => { s.reason = e.target.value; upd(); };
    const minDate = dpart(UNIT_ADDED), maxDate = dpart(NOW);
    const fromTimeMax = dpart(s.from) === maxDate ? tpart(NOW) : '';
    $('dates').innerHTML = `<div id="fFromField"><label for="fFD">Start from</label><div class="dtrow">
      <div class="withic">${IC.cal}<input class="ctrl" type="date" id="fFD" value="${dpart(s.from)}" min="${minDate}" max="${maxDate}" aria-describedby="fFromErr"></div>
      <div class="withic">${IC.clk}<input class="ctrl" type="time" id="fFT" value="${tpart(s.from)}" max="${fromTimeMax}" aria-describedby="fFromErr"></div></div><div id="fFromErr"></div></div>
      ${(commentMode === 'always' || s.notesOpen) ? `<div><label for="fNotes">Notes <span class="opt">(optional)</span></label><textarea class="ctrl" id="fNotes" placeholder="Add note">${esc(s.comment)}</textarea></div>`
        : `<button class="add-comment" id="fAddNotes" type="button">Add Notes</button>`}`;
    ['fFD','fFT'].forEach(i => { $(i).onchange = readDates; $(i).oninput = readDates; });
    if($('fNotes')) $('fNotes').oninput = e => { s.comment = e.target.value; upd(); };
    if($('fAddNotes')) $('fAddNotes').onclick = () => { s.notesOpen = true; paintForm(); requestAnimationFrame(() => $('fNotes')?.focus()); };
    bindStatusControl();
    upd();
  }
  function readDates(){
    s.from = join($('fFD').value, $('fFT').value);
    syncModalTimeLimits();
    upd();
  }
  function syncModalTimeLimits(){
    const maxDate = dpart(NOW);
    $('fFT').max = $('fFD').value === maxDate ? tpart(NOW) : '';
  }
  function showFieldError(fieldId, errorId, message){
    const field = $(fieldId), error = $(errorId);
    if(!field || !error) return;
    field.classList.toggle('field-error', Boolean(message));
    field.querySelectorAll('input, select, button').forEach(control => control.setAttribute('aria-invalid', String(Boolean(message))));
    error.innerHTML = message ? `<div class="field-msg" role="alert">${IC.err}<span>${message}</span></div>` : '';
  }
  function upd(){
    const errors = formErrors();
    const visible = s.showErrors ? errors : {};
    showFieldError('sStatusField', 'sStatusErr', visible.status || (availCtl === 'dropdown' ? visible.reason : ''));
    showFieldError('fReasonField', 'fReasonErr', availCtl === 'dropdown' ? '' : visible.reason);
    showFieldError('fFromField', 'fFromErr', visible.from);
    return Object.keys(errors).length === 0;
  }
  $('x').onclick = close;
  $('xClose').onclick = close;
  $('ok').onclick = () => {
    s.showErrors = true;
    if(!upd()){
      const firstInvalid = md.querySelector('.field-error select, .field-error input, #sStatusField.field-error button.on');
      firstInvalid?.focus();
      return;
    }
    const cm = s.comment.trim();
    const id = ++seq;
    recs = rebuildTimeline([...recs, {id, from:s.from, st:s.st, reason:s.st === 'no' ? s.reason : '', comment:cm, by:ME}]);
    fresh = id;
    close(); render();
  };
  paintForm();
}

function dlgEdit(id){
  const list = sorted(), i = list.findIndex(r => r.id === id);
  const r = list[i], previousRecord = list[i-1], nextRecord = list[i+1];
  const s = {st:r.st, reason:r.reason||'', comment:r.comment||'', notesOpen:false, from:r.from, showErrors:false};
  open(`<header><h3 id="dialogTitle">Edit availability record</h3>
    <button class="modal-close" id="xClose" type="button" aria-label="Close edit availability dialog" data-autofocus>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button></header><div class="b">
    <p class="record-intro">You’re about to edit an availability record of unit UN-401.</p>
    <div class="edit-status" id="eStatusField"><div class="record-status-row"><span class="record-status-label">Status</span><div id="eStatusControl"></div></div><div id="eStatusErr"></div></div>
    <div class="record-fields"><div id="rzn"></div><div id="dates"></div></div>
  </div><footer><button class="btn btn-g" id="x" type="button">Cancel</button>
    <button class="btn btn-p" id="ok" type="button">Save changes</button></footer>`);
  md.classList.add('record-md');
  const $ = i2 => document.getElementById(i2);
  function syncTimeLimits(){
    const maxDate = dpart(NOW);
    $('eFT').max = $('eFD').value === maxDate ? tpart(NOW) : '';
  }
  function errors(){
    const out = {};
    if(!s.from) out.from = 'Enter a start date and time.';
    else if(s.from < UNIT_ADDED) out.from = `The unit was added on ${fmt(UNIT_ADDED)}. Periods before that can’t be recorded.`;
    else if(s.from > NOW) out.from = 'The start cannot be in the future.';
    else if(list.some(item => item.id !== id && item.from === s.from)) out.from = 'Another availability record already starts at this date and time.';
    else if(previousRecord && s.from <= previousRecord.from) out.from = `Choose a time after the previous record starts: ${fmt(previousRecord.from)}.`;
    else if(nextRecord && s.from >= nextRecord.from) out.from = `Choose a time before the next record starts: ${fmt(nextRecord.from)}.`;
    else {
      const candidate = {st:s.st, reason:s.st === 'no' ? s.reason : ''};
      Object.assign(out, duplicateStateError(candidate, previousRecord, nextRecord));
    }
    return out;
  }
  function showError(fieldId, errorId, message){
    const field = $(fieldId), error = $(errorId); if(!field || !error) return;
    field.classList.toggle('field-error', Boolean(message));
    field.querySelectorAll('input, select, button').forEach(control => control.setAttribute('aria-invalid', String(Boolean(message))));
    error.innerHTML = message ? `<div class="field-msg" role="alert">${IC.err}<span>${message}</span></div>` : '';
  }
  function statusControlMarkup(){
    if(availCtl === 'toggle') return `<button class="switch ${s.st==='ok'?'on':''}" type="button" aria-label="Availability status: ${s.st==='ok'?'available':'unavailable'}" aria-pressed="${s.st==='ok'}" disabled><i></i></button>`;
    if(availCtl === 'seg') return `<div class="seg" role="group" aria-label="Availability status">
      ${['no','ok'].map(st => `<button type="button" class="${s.st===st?'on':''}" disabled aria-pressed="${s.st===st}"><span class="dot ${st}"></span> ${st==='ok'?'Available':'Unavailable'}</button>`).join('')}</div>`;
    const selected = AVAILABILITY_OPTIONS[availabilityOptionIndex(s)];
    return `<div class="status-dropdown"><button class="status-dropdown-trigger" type="button" aria-label="Availability status: ${selected.label}" disabled>
      <span class="status-dropdown-value"><span class="dot ${selected.st}"></span>${selected.label}</span>
      <svg class="status-dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button></div>`;
  }
  function paintForm(){
    $('eStatusControl').innerHTML = statusControlMarkup();
    $('rzn').innerHTML = s.st === 'no' && availCtl !== 'dropdown' ? `<div id="eReasonField"><label for="eReason">Reason unavailable <span class="opt">(optional)</span></label>
      <select class="ctrl" id="eReason" aria-describedby="eReasonErr"><option value="">Select reason</option>${REASONS.map(x=>`<option ${s.reason===x?'selected':''}>${x}</option>`).join('')}</select><div id="eReasonErr"></div></div>` : '';
    if($('eReason')) $('eReason').onchange = e => { s.reason = e.target.value; upd(); };
    const minDate = dpart(UNIT_ADDED), maxDate = dpart(NOW);
    const fromTimeMax = dpart(s.from) === maxDate ? tpart(NOW) : '';
    $('dates').innerHTML = `<div id="eFromField"><label for="eFD">Start from</label><div class="dtrow">
      <div class="withic">${IC.cal}<input class="ctrl" type="date" id="eFD" value="${dpart(s.from)}" min="${minDate}" max="${maxDate}" aria-describedby="eFromErr"></div>
      <div class="withic">${IC.clk}<input class="ctrl" type="time" id="eFT" value="${tpart(s.from)}" max="${fromTimeMax}" aria-describedby="eFromErr"></div></div><div id="eFromErr"></div></div>
      ${(commentMode === 'always' || s.comment || s.notesOpen) ? `<div><label for="eNotes">Notes <span class="opt">(optional)</span></label><textarea class="ctrl" id="eNotes" placeholder="Add note">${esc(s.comment)}</textarea></div>`
        : `<button class="add-comment" id="eAddNotes" type="button">Add Notes</button>`}`;
    ['eFD','eFT'].forEach(key => { $(key).onchange = readDates; $(key).oninput = readDates; });
    if($('eNotes')) $('eNotes').oninput = e => { s.comment = e.target.value; };
    if($('eAddNotes')) $('eAddNotes').onclick = () => { s.notesOpen = true; paintForm(); requestAnimationFrame(() => $('eNotes')?.focus()); };
    syncTimeLimits();
    upd();
  }
  function readDates(){
    s.from = join($('eFD').value, $('eFT').value);
    syncTimeLimits(); upd();
  }
  function upd(){
    const allErrors = errors(), visible = s.showErrors ? allErrors : {};
    showError('eFromField', 'eFromErr', visible.from);
    showError('eStatusField', 'eStatusErr', availCtl === 'dropdown' ? visible.reason : '');
    showError('eReasonField', 'eReasonErr', availCtl === 'dropdown' ? '' : visible.reason);
    return Object.keys(allErrors).length === 0;
  }
  $('x').onclick = close; $('xClose').onclick = close;
  $('ok').onclick = () => {
    s.showErrors = true;
    if(!upd()){
      md.querySelector('.field-error input')?.focus();
      return;
    }
    const updated = sorted(), j = updated.findIndex(x => x.id === id);
    updated[j] = {...updated[j], reason:s.st === 'no' ? s.reason : '', comment:s.comment.trim(), from:s.from, by:ME, isNew:true};
    recs = rebuildTimeline(updated);
    fresh = id; close(); render();
  };
  paintForm();
}
function dlgDel(id){
  const list = sorted(), i = list.findIndex(r => r.id === id);
  const r = list[i], prev = list[i-1], next = list[i+1];
  const after = rebuildTimeline(list.filter(x => x.id !== id));
  const w0 = prev ? prev.from : r.from, w1 = next ? (next.to || NOW) : (r.to || NOW);
  open(`<header><h3>Delete record?</h3></header><div class="b">
    <div><b>${label(r)}</b> · ${fmt(r.from)} – ${fmt(r.to)}<br>
      <span style="color:var(--text-2)">Set by ${esc(r.by)}</span></div>
    <div class="pv"><div class="cap">What happens</div>
      <div class="pvrow"><div class="lab">Before</div>${bar(list, w0, w1)}</div>
      <div class="pvrow"><div class="lab">After</div>${bar(after, w0, w1)}</div>
      <div class="ticks"><span>${shrt(w0)}</span><span>${shrt(w1)}</span></div>
      <div class="pvt w">The remaining events keep their start dates. Each status remains in effect until the next recorded status change.</div></div>
  </div><footer><button class="btn btn-g" id="x">Cancel</button>
    <button class="btn btn-d" id="ok">Delete record</button></footer>`);
  document.getElementById('x').onclick = close;
  document.getElementById('ok').onclick = () => { recs = after.map(x=>({...x, isNew:undefined})); close(); render(); };
}

document.getElementById('cSession').onchange = e => { sc.session = e.target.checked; gStatusOpen = false; render(); };
document.getElementById('cFields').onchange  = e => { sc.fields  = e.target.checked; gStatusOpen = false; render(); };
document.getElementById('cReset').onclick = () => { seed(); render(); };
document.getElementById('cClock').onchange = e => {
  liveClock = e.target.checked;
  seed();                 /* данные пересобираем под новое «сейчас» */
  gClear();
  render();
};
/* переключение контрола статуса: тумблер или сегмент-контрол */
document.querySelectorAll('#ctlVar button').forEach(a => a.onclick = () => {
  availCtl = a.dataset.v;
  gClear();
  document.querySelectorAll('#ctlVar button').forEach(x => x.classList.toggle('on', x === a));
  render();
});
document.querySelectorAll('#tableVar button').forEach(button => button.onclick = () => {
  availTable = button.dataset.v;
  document.querySelectorAll('#tableVar button').forEach(item => item.classList.toggle('on', item === button));
  render();
});
document.addEventListener('pointerdown', event => {
  const dropdown = document.getElementById('gStatusDropdown');
  if(gStatusOpen && dropdown && !dropdown.contains(event.target)){
    gStatusOpen = false;
    render();
  }
  if(modalStatusDropdown?.isOpen()){
    const modalDropdown = document.getElementById(modalStatusDropdown.id);
    if(modalDropdown && !modalDropdown.contains(event.target)) modalStatusDropdown.close();
  }
}, true);
render();

// dev-панель: сворачивание в иконку
(function(){
  var w=document.getElementById('devwrap'), t=document.getElementById('devToggle'), c=document.getElementById('devClose');
  if(t) t.onclick=function(){ w.classList.toggle('open'); };
  if(c) c.onclick=function(){ w.classList.remove('open'); };
})();
</script>
